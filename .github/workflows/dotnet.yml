name: KSAGEffects CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-package:
    runs-on: ubuntu-slim
    env:
      CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
      KSA_DLL_REPOSITORY: ${{ secrets.KSADLLRepo }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Prepare dependency folders
        shell: bash
        run: |
          mkdir -p deps deps/extracted deps/ksa

      - name: Download latest dependency DLLs from GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          owner = os.environ["GH_OWNER"]
          token = os.environ["GH_TOKEN"]
          deps_dir = pathlib.Path("deps")
          extracted_dir = deps_dir / "extracted"
          extracted_dir.mkdir(parents=True, exist_ok=True)

          def api_get(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          def download(url: str, target: pathlib.Path):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/octet-stream",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  target.write_bytes(response.read())

          def latest_release(repo: str, repoPath: str) -> dict:
              return api_get(f"https://api.github.com/repos/{repoPath}/{repo}/releases/latest")

          def find_asset(assets: list, predicate, error: str) -> dict:
              for asset in assets:
                  if predicate(asset):
                      return asset
              raise RuntimeError(error)

          def download_zip_published_dll(repo: str, repoPath: str, dll_name: str):
              release = latest_release(repo, repoPath)
              assets = release.get("assets", [])
              zip_asset = find_asset(
                  assets,
                  lambda a: a["name"].lower().endswith(".zip"),
                  f"No zip asset found in latest release for {repo}.",
              )

              zip_path = deps_dir / f"{repo}-latest.zip"
              extract_path = extracted_dir / repo
              extract_path.mkdir(parents=True, exist_ok=True)
              download(zip_asset["browser_download_url"], zip_path)

              with zipfile.ZipFile(zip_path, "r") as archive:
                  archive.extractall(extract_path)

              dll_matches = list(extract_path.rglob(dll_name))
              if not dll_matches:
                  raise RuntimeError(f"{dll_name} not found in latest {repo} zip release asset.")

              target = deps_dir / dll_name
              target.write_bytes(dll_matches[0].read_bytes())

          def download_direct_dll(repo: str, repoPath: str, dll_name: str):
              release = latest_release(repo, repoPath)
              assets = release.get("assets", [])
              dll_asset = find_asset(
                  assets,
                  lambda a: a["name"].lower() == dll_name.lower(),
                  f"No direct DLL asset named {dll_name} found in latest release for {repo}.",
              )
              download(dll_asset["browser_download_url"], deps_dir / dll_name)

          download_zip_published_dll("KittenExtensions", "tsholmes", "KittenExtensions.dll")
          download_zip_published_dll("ShaderExtensions", "AMPW-german", "ShaderExtensions.dll")
          download_direct_dll("GEffectsLogic", "AMPW-german", "GEffectsLogic.dll")
          PY

      - name: Validate private KSA DLL repository setting
        if: ${{ env.KSA_DLL_REPOSITORY == '' }}
        shell: bash
        run: |
          echo "Missing repository variable KSA_DLL_REPOSITORY (expected format: owner/repo)." >&2
          exit 1

      - name: Parse private KSA DLL repository
        id: ksa-repo
        shell: bash
        run: |
          owner="${KSA_DLL_REPOSITORY%%/*}"
          repo="${KSA_DLL_REPOSITORY##*/}"
          if [ -z "$owner" ] || [ -z "$repo" ] || [ "$owner" = "$repo" ]; then
            echo "Invalid KSADLLRepo secret value: ${KSA_DLL_REPOSITORY}. Expected owner/repo." >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for KSA DLL repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.ksa-repo.outputs.owner }}
          repositories: ${{ steps.ksa-repo.outputs.repo }}

      - name: Download private KSA DLLs from repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${KSA_DLL_REPOSITORY}.git" deps/ksa-repo
          find deps/ksa-repo -maxdepth 1 -type f -name '*.dll' -exec cp {} deps/ksa/ \;
          dll_count=$(find deps/ksa -maxdepth 1 -type f -name '*.dll' | wc -l)
          if [ "$dll_count" -eq 0 ]; then
            echo "No DLL files found in root of ${KSA_DLL_REPOSITORY}." >&2
            exit 1
          fi

      - name: Switch project references to CI DLL hint paths
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          project_path = pathlib.Path("KSAGEffects/KSAGEffects.csproj")
          content = project_path.read_text(encoding="utf-8")

          content = re.sub(
              r'<ItemGroup>\s*<ProjectReference Include="\.\.\\\.\.\\GEffectsLogic\\GEffectsLogic\\GEffectsLogic\.csproj" />\s*</ItemGroup>',
              '<ItemGroup>\n\t\t<Reference Include="GEffectsLogic">\n\t\t\t<HintPath>../deps/GEffectsLogic.dll</HintPath>\n\t\t\t<Private>False</Private>\n\t\t</Reference>\n\t</ItemGroup>',
              content,
              count=1,
              flags=re.S,
          )

          content = content.replace(
              r"..\..\..\..\Documents\My Games\Kitten Space Agency\mods\KittenExtensions\KittenExtensions.dll",
              "../deps/KittenExtensions.dll",
          )
          content = content.replace(
              r"..\..\..\..\Documents\My Games\Kitten Space Agency\mods\ShaderExtensions\ShaderExtensions.dll",
              "../deps/ShaderExtensions.dll",
          )

          project_path.write_text(content, encoding="utf-8")
          PY

      - name: Detect VersionPrefix change on main push
        id: versionprefix
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff "$before" "${{ github.sha }}" -- KSAGEffects/KSAGEffects.csproj | grep -q 'VersionPrefix'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependencies
        run: dotnet restore KSAGEffects/KSAGEffects.csproj

      - name: Build KSAGEffects
        shell: bash
        run: |
          rm -rf Release/KSAGEffects
          mkdir -p Release/KSAGEffects

          ksa_dir="$(pwd)/deps/ksa/"
          dotnet build KSAGEffects/KSAGEffects.csproj -c "$CONFIGURATION" --no-restore /p:KSADir="$ksa_dir" /p:OutputPath="../Release/KSAGEffects/"

      - name: Create artifact zip
        shell: bash
        run: |
          rm -f KSAGEffects.zip
          python3 - <<'PY'
          import pathlib
          import zipfile

          source = pathlib.Path("Release/KSAGEffects")
          target = pathlib.Path("KSAGEffects.zip")

          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for file in source.rglob("*"):
                  if file.is_file():
                      archive.write(file, file.relative_to(source))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSAGEffects-${{ env.CONFIGURATION }}
          path: KSAGEffects.zip

      - name: Release pipeline placeholder
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.versionprefix.outputs.changed == 'true' }}
        shell: bash
        run: |
          echo "VersionPrefix changed on main. Placeholder release step executed."
